[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "integer-alias-sampling"
version = "0.1.0"
description = "Integer alias tables with exact mass verification and bounded-bit sampling diagnostics."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<9", "matplotlib>=3.9,<4"]

[project.scripts]
integer-alias = "integer_alias.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error"]
